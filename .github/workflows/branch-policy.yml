name: Branch and PR policy

on:
  pull_request:
    branches: [develop, QA, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-flow:
    name: Validate academic PR direction
    runs-on: ubuntu-latest
    steps:
      - name: Validate allowed branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -eu
          case "$BASE" in
            develop)
              case "$HEAD" in
                feat/*|fix/*|hotfix/*|security/*|test/*|docs/*|chore/*) ;;
                *) echo "PR a develop debe venir de una rama auxiliar (feat/*, fix/*, hotfix/*, security/*, test/*, docs/*, chore/*): $HEAD"; exit 1 ;;
              esac
              ;;
            QA) [ "$HEAD" = "develop" ] || { echo "PR a QA debe venir exclusivamente de develop: $HEAD"; exit 1; } ;;
            main) [ "$HEAD" = "QA" ] || { echo "PR a main debe venir exclusivamente de QA: $HEAD"; exit 1; } ;;
            *) echo "Base no soportada en el flujo académico: $BASE"; exit 1 ;;
          esac
          echo "Flujo académico válido: $HEAD -> $BASE"
